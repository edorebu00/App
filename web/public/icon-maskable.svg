<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    My Vehicle - monogramma inciso su ottone.

    Deriva dal marchio dell'intestazione (M scura su tessera dorata) invece di reinventarne uno:
    l'icona e il logo devono leggersi come la stessa cosa. La lettera e' la M di Fraunces peso
    700 - lo stesso carattere dei titoli dell'app - estratta dal font come tracciato, non
    ridisegnata a mano.

    Due accorgimenti di materia, che sono cio' che distingue una tessera gialla da una placca di
    ottone: il gradiente corre in diagonale con una fascia piu' chiara a due terzi (e' cosi' che
    la luce si comporta su una superficie metallica curva) e una lama di luce obliqua attraversa
    la tessera. Sotto la lettera c'e' una copia piu' chiara spostata di poco: e' l'inganno che fa
    leggere "inciso" invece che "stampato sopra".

    ATTENZIONE: gli id "bg" e "mark" non sono decorativi. scripts/generate-icons.mjs li usa per
    costruire la versione maskable, dove il fondo deve restare a tutta pagina e solo il segno va
    rimpicciolito nella zona sicura. Rinominandoli, le icone Android si rompono.
  -->
  <defs>
    <linearGradient id="brass" x1="6" y1="0" x2="58" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9b671"/>
      <stop offset="0.42" stop-color="#e8d3a1"/>
      <stop offset="0.62" stop-color="#cca558"/>
      <stop offset="1" stop-color="#a8813c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.30" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.66" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    
  </defs>

