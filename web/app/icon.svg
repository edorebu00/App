<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    My Vehicle - tachimetro e logotipo su ottone.

    Il quadrante e' un contagiri classico: arco di 270 gradi aperto in basso, sette tacche e la
    lancetta puntata in alto a destra, che e' la posizione che si legge come "in velocita'".
    Vale per auto e moto, e richiama la sezione circuiti dell'app.

    La scritta e' Fraunces peso 900 - lo stesso carattere dei titoli - convertita in tracciato,
    non testo: cosi' l'icona non dipende da un font installato. Il peso 900 e una spaziatura
    positiva non sono un vezzo estetico, sono cio' che tiene separate le lettere quando l'icona
    scende a 48 pixel. Occupa l'87% della larghezza: piu' larga verrebbe sfiorata dal ritaglio
    tondo di Android, piu' stretta diventerebbe illeggibile prima.

    NOTA ONESTA: a 48px (launcher Android) e a 29px (impostazioni iOS) la scritta non si legge,
    diventa una fascia scura. E' inevitabile con nove lettere in un quadrato di quella misura, ed
    e' una scelta consapevole: il nome dell'app compare comunque sotto l'icona, messo li' dal
    sistema operativo. Il quadrante resta riconoscibile a ogni dimensione ed e' lui a fare il
    lavoro di riconoscimento.

    ATTENZIONE: gli id "bg" e "mark" non sono decorativi. scripts/generate-icons.mjs li usa per
    costruire la versione maskable, dove il fondo deve restare a tutta pagina e solo il segno va
    rimpicciolito nella zona sicura. Rinominandoli, le icone Android si rompono.
  -->
  <defs>
    <linearGradient id="brass" x1="6" y1="0" x2="58" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9b671"/>
      <stop offset="0.42" stop-color="#e8d3a1"/>
      <stop offset="0.62" stop-color="#cca558"/>
      <stop offset="1" stop-color="#a8813c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.30" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.66" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="64" height="64" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect id="bg" width="64" height="64" fill="url(#brass)"/>
    <rect width="64" height="64" fill="url(#sheen)"/>
